name: Crystal CI

# Pushes to master, by hand, and nightly (the Crystal `latest` legs float, so a day with no push can still break).
# A push that touches only documentation, design notes or assistant configuration skips this workflow; docs.yaml
# checks the docs. Editing a workflow, a script, a spec or a template always runs it.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".github/issue_template.md"
      - "*.md"
      - ".gitbook.yaml"
      - "scripts/check_docs.py"
      - "LICENSE"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One queue per ref: a run that is waiting is replaced by the newest push; a running one (it may be releasing) finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The CLI is compiled once per Crystal version and shared with every job below as an artifact: it used to be compiled
  # again in each of them. Each job uses the binary built by the compiler it runs on.
  cli:
    name: build the CLI (Crystal ${{ matrix.crystal }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 1.22.1 is the floor (shard.yml) and the version the repository and generated projects are pinned to
        # (.tool-versions); latest catches language changes early. The release needs both.
        crystal: ["1.22.1", "latest"]
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev
      - name: Install shards
        run: shards install
      - name: Check formatting
        run: crystal tool format --check ./src
      - name: Build the CLI
        run: |
          mkdir -p bin
          crystal build src/azu_cli.cr -o bin/azu --no-debug
      - uses: actions/upload-artifact@v4
        with:
          name: azu-cli-${{ matrix.crystal }}
          path: bin/azu
          retention-days: 1
          if-no-files-found: error

  build:
    name: build (Crystal ${{ matrix.crystal }})
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.22.1", "latest"]
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev
      - name: Install shards
        run: shards install
      # The integration specs run `bin/azu`.
      - uses: actions/download-artifact@v4
        with:
          name: azu-cli-${{ matrix.crystal }}
          path: bin
      - run: chmod +x bin/azu
      - name: Run Specs
        run: crystal spec

  generated-app:
    name: generated ${{ matrix.type }} app (Crystal ${{ matrix.crystal }}, ${{ matrix.db }})
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crystal: "1.22.1", db: sqlite, type: web }
          - { crystal: "1.22.1", db: sqlite, type: api }
          - { crystal: "latest", db: sqlite, type: web }
          - { crystal: "latest", db: postgresql, type: web }
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    # The Redis the e2e runs a generated JoobQ job through (E2E_REDIS_URL); the job container reaches it as `redis`.
    services:
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev sqlite3 curl
      - uses: actions/download-artifact@v4
        with:
          name: azu-cli-${{ matrix.crystal }}
          path: bin
      - run: chmod +x bin/azu
      # On SQLite the script also generates a Post scaffold (and, for web, a Chat channel and authentication), migrates it
      # with `azu db:setup` and exercises them.
      - name: Generate, build, boot and request a new project and its scaffold
        env:
          E2E_REDIS_URL: redis://redis:6379
        run: E2E_DB=${{ matrix.db }} scripts/e2e_generated_app.sh ${{ matrix.type }}

  generators:
    name: all generators (web and api)
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev
      - uses: actions/download-artifact@v4
        with:
          name: azu-cli-1.22.1
          path: bin
      - run: chmod +x bin/azu
      - name: Compile every generator in a web and an api project
        run: |
          status=0
          for type in web api; do
            echo "::group::generators ($type)"
            scripts/check_generators.sh "$type" || { echo "::error::generators failed for the $type project"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  spark-browser:
    name: generated Spark app (Chromium, SQLite)
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: crystallang/crystal:1.22.1
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/ms-playwright
          key: playwright-1.62.0-chromium-crystal-1.22.1
      - name: Install browser validation dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-venv redis-server libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev
          python3 -m venv /tmp/spark-browser-tools
          /tmp/spark-browser-tools/bin/pip install playwright==1.62.0
          /tmp/spark-browser-tools/bin/python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: azu-cli-1.22.1
          path: bin
      - run: chmod +x bin/azu
      - name: Generate, migrate, compile and click through live CRUD
        run: |
          export PATH="/tmp/spark-browser-tools/bin:$PATH"
          scripts/e2e_spark_app.sh
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spark-browser-evidence
          path: |
            /tmp/azu-spark-e2e-*/evidence/*.png
            /tmp/azu-spark-e2e-*/evidence/*.log
            /tmp/azu-spark-e2e-*/evidence/report.json
          retention-days: 3

  # The three JoobQ versions only differ in which one the adapter is compiled against, so one job runs them in turn
  # against the one Redis service.
  joobq-adapter:
    name: live JoobQ adapter (0.4.2, b38961d, 0.5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: crystallang/crystal:1.22.1
    services:
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          apt-get update
          apt-get install -y python3 libssl-dev libevent-dev libyaml-dev
      - name: Check redaction and atomic replay against Redis
        env:
          REDIS_HOST: redis
          REDIS_PORT: "6379"
        run: |
          status=0
          # JoobQ 0.5.1 includes empty-worker and typed queue-discovery fixes.
          for ref in 0.4.2 b38961d62ef1d70237a6f701b9af8ff34c9dbe8b 0.5.1; do
            echo "::group::JoobQ $ref"
            JOOBQ_REF=$ref scripts/check_joobq_adapter.sh || { echo "::error::the adapter check failed against JoobQ $ref"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  jobs-commands:
    name: Generated Azu v1 jobs commands
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
      - name: Install integration dependencies
        run: |
          apt-get update
          apt-get install -y python3 redis-server redis-tools libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev
      - uses: actions/download-artifact@v4
        with:
          name: azu-cli-1.22.1
          path: bin
      - run: chmod +x bin/azu
      - name: Generate, migrate and exercise jobs against owned Redis
        run: python3 scripts/check_jobs_commands.py "$PWD/bin/azu"

  # Every green push that changed anything beyond documentation is released. The release lifecycle checks (matching
  # manifests, atomic tags, retry recovery) run first, in this job, so they gate it without a runner of their own.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - cli
      - build
      - generated-app
      - generators
      - joobq-adapter
      - jobs-commands
      - spark-browser
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Verify matching manifests, atomic tags and retry recovery
        run: python3 .github/scripts/test_release.py
      - name: Commit matching shard version and atomically push master and tag
        id: prepare
        run: python3 .github/scripts/release.py
      - name: Publish GitHub release with generated notes
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_LATEST: ${{ steps.prepare.outputs.latest }}
        run: python3 .github/scripts/release.py --publish "$RELEASE_TAG" --latest "$RELEASE_LATEST"
