name: Crystal CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write # push branches, push tags, create release
  pull-requests: write # open / update PR

jobs:
  build:
    name: build (Crystal ${{ matrix.crystal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22.1 is the floor (shard.yml) and the version the repository and generated projects are pinned to
        # (.tool-versions); latest catches language changes early. The release needs both.
        crystal: ["1.22.1", "latest"]
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev python3
      - name: Install shards
        run: shards install --frozen
      - name: Check dependency promotion guard
        run: python3 scripts/test_framework_versions.py
      - name: Verify CQL JSON APIs and the generated-save boundary
        run: python3 scripts/check_cql_json.py
      - name: Check formatting
        run: crystal tool format --check ./src
      # The integration specs run `bin/azu`.
      - name: Build the CLI
        run: |
          mkdir -p bin
          crystal build src/azu_cli.cr -o bin/azu --no-debug
      - name: Run Specs
        run: crystal spec
  generated-app:
    name: generated ${{ matrix.type }} app (Crystal ${{ matrix.crystal }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crystal: "1.22.1", db: sqlite, type: web }
          - { crystal: "1.22.1", db: sqlite, type: api }
          - { crystal: "1.22.1", db: sqlite, type: cli }
          - { crystal: "latest", db: sqlite, type: web }
          - { crystal: "latest", db: postgresql, type: web }
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    # The Redis the e2e runs a generated JoobQ job through (E2E_REDIS_URL); the job container reaches it as `redis`.
    services:
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev sqlite3 curl
      - name: Build the CLI
        run: |
          shards install --frozen
          mkdir -p bin
          crystal build src/azu_cli.cr -o bin/azu --no-debug
      # On SQLite the script also generates a Post scaffold (and, for web, a Chat channel and authentication), migrates it
      # with `azu db:setup` and exercises them.
      - name: Generate, build, boot and request a new project and its scaffold
        env:
          E2E_REDIS_URL: redis://redis:6379
        run: E2E_DB=${{ matrix.db }} scripts/e2e_generated_app.sh ${{ matrix.type }}
  generators:
    name: all generators (${{ matrix.type }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        type: [web, api]
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev python3 redis-server
      - name: Build CLI and compile every generator
        run: |
          shards install --frozen
          mkdir -p bin
          crystal build src/azu_cli.cr -o bin/azu --no-debug
          scripts/check_generators.sh ${{ matrix.type }}
  database-compatibility:
    name: v1 ${{ matrix.adapter }} ${{ matrix.type }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        adapter: [postgresql, mysql]
        type: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22.1"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev redis-server python3 openssl
      - name: Build CLI and exercise disposable database applications
        run: |
          shards install --frozen
          mkdir -p bin
          crystal build src/azu_cli.cr -o bin/azu --no-debug
          python3 scripts/e2e_database_app.py --adapter ${{ matrix.adapter }} --type ${{ matrix.type }}
      - name: Verify PostgreSQL JSONB models and query APIs
        if: matrix.adapter == 'postgresql' && matrix.type == 'api'
        run: python3 scripts/check_cql_json.py --postgres
      - name: Upload resolved versions, database and telemetry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-${{ matrix.adapter }}-${{ matrix.type }}
          path: /tmp/azu-db-e2e-*/evidence/
          retention-days: 7
  production-image:
    name: generated ${{ matrix.type }} production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        type: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22.1"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev python3
      - name: Build CLI and test generated image
        run: |
          shards install --frozen
          mkdir -p bin
          crystal build src/azu_cli.cr -o bin/azu --no-debug
          scripts/e2e_docker.sh ${{ matrix.type }}
  spark-browser:
    name: generated daisyUI and Spark apps (Chromium, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
      - name: Install browser validation dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-venv redis-server libreadline-dev libevent-dev libssl-dev libxml2-dev libyaml-dev libgmp-dev libsqlite3-dev python3
          python3 -m venv /tmp/spark-browser-tools
          /tmp/spark-browser-tools/bin/pip install playwright==1.62.0
          /tmp/spark-browser-tools/bin/python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate, migrate, compile and click through live CRUD
        run: |
          export PATH="/tmp/spark-browser-tools/bin:$PATH"
          shards install --frozen
          mkdir -p bin
          crystal build src/azu_cli.cr -o bin/azu --no-debug
          scripts/e2e_spark_app.sh
          scripts/e2e_browser_app.sh
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-browser-evidence
          path: |
            /tmp/azu-spark-e2e-*/evidence/*.png
            /tmp/azu-spark-e2e-*/evidence/*.log
            /tmp/azu-spark-e2e-*/evidence/report.json
            /tmp/azu-spark-e2e-*/evidence/shard.lock
            /tmp/azu-browser-e2e-*/evidence/
          retention-days: 7
  joobq-adapter:
    name: live JoobQ adapter (${{ matrix.ref }})
    strategy:
      fail-fast: false
      matrix:
        ref: ["0.4.2", "b38961d62ef1d70237a6f701b9af8ff34c9dbe8b"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: crystallang/crystal:1.22.1
    services:
      redis:
        image: redis:7
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          apt-get update
          apt-get install -y python3 libssl-dev libevent-dev libyaml-dev
      - name: Check redaction and atomic replay against Redis
        env:
          JOOBQ_REF: ${{ matrix.ref }}
          REDIS_HOST: redis
          REDIS_PORT: "6379"
        run: scripts/check_joobq_adapter.sh
  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - generated-app
      - generators
      - joobq-adapter
      - spark-browser
      - database-compatibility
      - production-image
    # Releases and version bumps are for master only, never for pull requests.
    if: ${{ success() && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Require tested stable framework releases
        run: python3 scripts/update_framework_versions.py --check
      - name: Compute Release Version
        id: semver
        uses: paulhatch/semantic-version@v4.0.2
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          # A string to determine the format of the version output
          format: "${major}.${minor}.${patch}"
          # If this is set to true, *every* commit will be treated as a new version.
          bump_each_commit: false

      - name: Configure git identity
        run: |
          git config user.name "eliasjpr"
          git config user.email "eliasjpr@gmail.com"

      - name: Bump Shard Version
        id: bump-shard
        uses: fjogeleit/yaml-update-action@master
        with:
          valueFile: shard.yml
          propertyPath: version
          value: ${{steps.semver.outputs.version}}
          commitChange: true
          targetBranch: master
          masterBranchName: master
          createPR: false
          branch: master
          message: Set shard version ${{ steps.semver.outputs.version }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{steps.semver.outputs.version_tag}}
          release_name: Release v${{steps.semver.outputs.version}}
          draft: false
          prerelease: false
